name: Build Mashwari Passenger APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  passenger-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check source archive
        run: |
          test -f ride-algeria-source.zip || (echo "Missing ride-algeria-source.zip in repository root" && exit 1)
          unzip -q ride-algeria-source.zip
          test -f ride_algeria_full_stack/passenger_app/pubspec.yaml || (echo "Passenger Flutter project not found at expected archive path" && exit 1)
      - name: Check release configuration
        env:
          SUPABASE_URL: https://neztjanpcwevsslrizns.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          MAP_TILE_URL: https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png
        run: |
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "Missing repository secret SUPABASE_PUBLISHABLE_KEY" && exit 1)
          test -n "$MAP_TILE_URL" || (echo "Map tile URL is not configured" && exit 1)
      - name: Generate Android project
        working-directory: ride_algeria_full_stack/passenger_app
        run: flutter create --platforms=android --org dz.ridealgeria .
      - name: Enable persistent email/password login
        run: python3 scripts/enable_email_auth.py ride_algeria_full_stack/passenger_app/lib/main.dart ride_algeria_full_stack/passenger_app/android/app/src/main/AndroidManifest.xml
      - name: Patch Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("ride_algeria_full_stack/passenger_app/android/app/src/main/AndroidManifest.xml")
          if not manifest.is_file():
              raise SystemExit(f"Generated Android manifest not found: {manifest}")
          content = manifest.read_text(encoding="utf-8")
          permissions = (
              "android.permission.INTERNET",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
          )
          newline = chr(10)
          missing = [p for p in permissions if f'android:name="{p}"' not in content]
          permission_lines = newline.join(f'    <uses-permission android:name="{p}" />' for p in missing)
          if permission_lines:
              marker = "<application"
              if marker not in content:
                  raise SystemExit("Android manifest has no application element")
              content = content.replace(marker, permission_lines + newline + "    " + marker, 1)
          manifest.write_text(content, encoding="utf-8")
          print("Android permissions verified and patched")
          PY
      - name: Resolve dependencies
        working-directory: ride_algeria_full_stack/passenger_app
        run: flutter pub get
      - name: Analyze Dart source
        working-directory: ride_algeria_full_stack/passenger_app
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        working-directory: ride_algeria_full_stack/passenger_app
        env:
          SUPABASE_URL: https://neztjanpcwevsslrizns.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          MAP_TILE_URL: https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png
          MAP_ATTRIBUTION: © OpenStreetMap contributors © CARTO
        run: flutter build apk --release --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" --dart-define=MAP_TILE_URL="$MAP_TILE_URL" --dart-define=MAP_ATTRIBUTION="${MAP_ATTRIBUTION:-Map data provider}"
      - uses: actions/upload-artifact@v4
        with:
          name: mashwari-passenger-release-apk
          path: ride_algeria_full_stack/passenger_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
